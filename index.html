<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compliance Report - Walter Reed Bethesda Heater Training</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #1f2937;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      border-top: 5px solid #003366;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #003366;
      margin: 0;
    }
    .btn {
      background-color: #003366;
      color: #ffffff;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn-secondary {
      background-color: #475569;
    }
    .btn-danger {
      background-color: #b91c1c;
      color: #ffffff;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-danger:hover {
      background-color: #991b1b;
    }
    .btn-danger:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .btn:hover {
      opacity: 0.92;
    }
    .stats {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 1rem 1.5rem;
      border-radius: 6px;
      min-width: 160px;
    }
    .stat-card .number {
      font-size: 1.75rem;
      font-weight: 700;
      color: #003366;
    }
    .stat-card .label {
      font-size: 0.85rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"],
    input[type="password"],
    select {
      padding: 0.5rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    input[type="text"] {
      flex: 1;
      min-width: 220px;
    }
    .admin-box {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 0.45rem 0.75rem;
      border-radius: 4px;
    }
    .admin-status {
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
    }
    .admin-status.unlocked {
      color: #166534;
    }
    .status-banner {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      display: none;
      font-size: 0.9rem;
    }
    .status-banner.success {
      display: block;
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .status-banner.error {
      display: block;
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f8fafc;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background-color: #dcfce7;
      color: #166534;
    }
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>Walter Reed Bethesda — Heater Training Compliance</h1>
      <p style="margin: 0.25rem 0 0; color: #64748b; font-size: 0.9rem;">
        Tracking Statement: <em>"I have received training pertaining to space heaters."</em>
      </p>
    </div>
    <div>
      <button id="exportCsvBtn" class="btn btn-secondary">Export CSV</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="number" id="totalCount">0</div>
      <div class="label">Total Compliant</div>
    </div>
    <div class="stat-card">
      <div class="number" id="deptCount">0</div>
      <div class="label">Departments Reporting</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search by name, email, or department...">
    <select id="deptFilter">
      <option value="">All Departments</option>
    </select>
    <div class="admin-box">
      <input type="password" id="deleteCodeInput" placeholder="Code (1875)" style="width: 120px;">
      <button type="button" id="unlockDeleteBtn" class="btn" style="padding: 0.45rem 0.8rem; font-size: 0.85rem;">Unlock Delete</button>
      <span id="adminStatus" class="admin-status">Locked</span>
    </div>
  </div>

  <div id="statusBanner" class="status-banner"></div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Status</th>
        <th>Date Submitted</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr>
        <td colspan="6" class="empty-state">Loading compliance records...</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
  const DELETE_CODE = '1875';

  // Match the same repo settings used in submit.html so row deletions update compliance.json
  const GITHUB_CONFIG = {
    owner: 'atomic-male',
    repo: 'heater-training-2026',
    filePath: 'compliance.json',
    branch: 'main',
    token: 'YOUR_FULL_GITHUB_TOKEN_HERE'
  };

  let allRecords = [];
  let deleteUnlocked = false;

  function showBanner(message, isError = false) {
    const banner = document.getElementById('statusBanner');
    banner.textContent = message;
    banner.className = 'status-banner ' + (isError ? 'error' : 'success');
  }

  function unlockDelete() {
    const entered = document.getElementById('deleteCodeInput').value.trim();
    const statusEl = document.getElementById('adminStatus');

    if (entered === DELETE_CODE) {
      deleteUnlocked = true;
      statusEl.textContent = 'Unlocked';
      statusEl.className = 'admin-status unlocked';
      showBanner('Delete mode unlocked. Click Delete on a row to remove it from compliance.json.');
      renderFilteredTable();
    } else {
      deleteUnlocked = false;
      statusEl.textContent = 'Locked';
      statusEl.className = 'admin-status';
      showBanner('Invalid delete code.', true);
    }
  }

  async function loadComplianceData() {
    const tableBody = document.getElementById('tableBody');
    try {
      const response = await fetch(`compliance.json?t=${new Date().getTime()}`);
      if (!response.ok) {
        throw new Error(`Could not load compliance.json (HTTP ${response.status})`);
      }
      const rawData = await response.json();
      // Attach a stable index from the underlying JSON array so filtering/sorting deletes the right item
      allRecords = rawData.map((record, idx) => ({ ...record, _index: idx }));
      populateDepartmentFilter(allRecords);
      updateStats(allRecords);
      renderFilteredTable();
    } catch (error) {
      console.error(error);
      tableBody.innerHTML = `<tr><td colspan="6" class="empty-state">No records found or unable to load <code>compliance.json</code>.</td></tr>`;
    }
  }

  function populateDepartmentFilter(records) {
    const deptFilter = document.getElementById('deptFilter');
    const currentValue = deptFilter.value;
    deptFilter.innerHTML = '<option value="">All Departments</option>';

    const departments = [...new Set(records.map(r => r.department).filter(Boolean))].sort();
    departments.forEach(dept => {
      const option = document.createElement('option');
      option.value = dept;
      option.textContent = dept;
      deptFilter.appendChild(option);
    });

    if (departments.includes(currentValue)) {
      deptFilter.value = currentValue;
    }
  }

  function updateStats(records) {
    document.getElementById('totalCount').textContent = records.length;
    const uniqueDepts = new Set(records.map(r => r.department).filter(Boolean));
    document.getElementById('deptCount').textContent = uniqueDepts.size;
  }

  function renderTable(records) {
    const tableBody = document.getElementById('tableBody');
    if (records.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="6" class="empty-state">No matching compliance records found.</td></tr>`;
      return;
    }

    const sorted = [...records].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    tableBody.innerHTML = sorted.map(record => {
      const dateStr = record.timestamp ? new Date(record.timestamp).toLocaleString() : '';
      const deleteBtnHtml = deleteUnlocked
        ? `<button type="button" class="btn-danger" onclick="deleteRecord(${record._index})">Delete</button>`
        : `<span style="color: #94a3b8; font-size: 0.8rem;">Locked</span>`;

      return `
        <tr>
          <td><strong>${escapeHtml(record.name)}</strong></td>
          <td>${escapeHtml(record.email)}</td>
          <td>${escapeHtml(record.department)}</td>
          <td><span class="badge">${record.compliant ? 'Compliant' : 'Pending'}</span></td>
          <td>${escapeHtml(dateStr)}</td>
          <td>${deleteBtnHtml}</td>
        </tr>
      `;
    }).join('');
  }

  function renderFilteredTable() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const selectedDept = document.getElementById('deptFilter').value;

    const filtered = allRecords.filter(record => {
      const matchesSearch =
        (record.name || '').toLowerCase().includes(searchTerm) ||
        (record.email || '').toLowerCase().includes(searchTerm) ||
        (record.department || '').toLowerCase().includes(searchTerm);
      const matchesDept = selectedDept === '' || record.department === selectedDept;
      return matchesSearch && matchesDept;
    });

    renderTable(filtered);
  }

  async function deleteRecord(recordIndex) {
    const enteredCode = document.getElementById('deleteCodeInput').value.trim();
    if (!deleteUnlocked || enteredCode !== DELETE_CODE) {
      showBanner('Enter code 1875 and click Unlock Delete before removing a record.', true);
      return;
    }

    const target = allRecords.find(r => r._index === recordIndex);
    if (!target) return;

    const confirmed = confirm(`Delete compliance record for "${target.name}" (${target.department}) from compliance.json?`);
    if (!confirmed) return;

    const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;

    try {
      // 1. Fetch latest file from GitHub to get current SHA and records
      const getResponse = await fetch(`${apiUrl}?ref=${GITHUB_CONFIG.branch}`, {
        headers: {
          'Authorization': `Bearer ${GITHUB_CONFIG.token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (!getResponse.ok) {
        throw new Error(`Failed to fetch compliance.json from GitHub (HTTP ${getResponse.status})`);
      }

      const fileData = await getResponse.json();
      const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
      const currentArray = JSON.parse(decodedContent);

      // Remove by index if still matching, otherwise fall back to matching fields + timestamp
      let updatedArray;
      if (
        recordIndex >= 0 &&
        recordIndex < currentArray.length &&
        currentArray[recordIndex].name === target.name &&
        currentArray[recordIndex].timestamp === target.timestamp
      ) {
        updatedArray = currentArray.filter((_, idx) => idx !== recordIndex);
      } else {
        updatedArray = currentArray.filter(
          item => !(
            item.name === target.name &&
            item.email === target.email &&
            item.timestamp === target.timestamp
          )
        );
      }

      const updatedJsonString = JSON.stringify(updatedArray, null, 2);
      const encodedContent = btoa(unescape(encodeURIComponent(updatedJsonString)));

      // 2. Commit updated JSON back to GitHub
      const putResponse = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${GITHUB_CONFIG.token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Delete heater compliance record for ${target.name}`,
          content: encodedContent,
          sha: fileData.sha,
          branch: GITHUB_CONFIG.branch
        })
      });

      if (!putResponse.ok) {
        const errData = await putResponse.json();
        throw new Error(errData.message || `GitHub API Error (HTTP ${putResponse.status})`);
      }

      allRecords = updatedArray.map((record, idx) => ({ ...record, _index: idx }));
      populateDepartmentFilter(allRecords);
      updateStats(allRecords);
      renderFilteredTable();
      showBanner(`Deleted record for ${target.name} and updated compliance.json on GitHub.`);
    } catch (error) {
      console.error(error);
      showBanner(`Error deleting record: ${error.message}`, true);
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.getElementById('unlockDeleteBtn').addEventListener('click', unlockDelete);
  document.getElementById('searchInput').addEventListener('input', renderFilteredTable);
  document.getElementById('deptFilter').addEventListener('change', renderFilteredTable);

  document.getElementById('exportCsvBtn').addEventListener('click', () => {
    if (allRecords.length === 0) return;
    const headers = ['Name', 'Email', 'Department', 'Compliant', 'Statement', 'Timestamp'];
    const rows = allRecords.map(r => [
      `"${(r.name || '').replace(/"/g, '""')}"`,
      `"${(r.email || '').replace(/"/g, '""')}"`,
      `"${(r.department || '').replace(/"/g, '""')}"`,
      r.compliant,
      `"${(r.statement || '').replace(/"/g, '""')}"`,
      r.timestamp || ''
    ].join(','));

    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', 'wrb_heater_compliance.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  loadComplianceData();
</script>

</body>
</html>
